# Merge this into ~/.hermes/config.yaml.
platforms:
  qq:
    enabled: true
    extra:
      # NapCat/OneBot HTTP and WebSocket endpoints.
      onebot_url: http://127.0.0.1:3000
      onebot_token: YOUR_NAPCAT_TOKEN
      onebot_ws_url: ws://127.0.0.1:3001
      onebot_ws_token: YOUR_NAPCAT_TOKEN

      # Access policy.  Use allowlist for personal deployments.
      dm_policy: allowlist          # open | allowlist | disabled
      group_policy: allowlist       # open | allowlist | disabled
      allow_from:
        - '123456789'               # QQ user id allowed in private chat
      group_allow_from:
        - '987654321'               # QQ group id allowed for group chat
      allowed_group_users: []       # optional user-id allowlist inside groups

      # Group behavior.
      group_chat_all: true          # true = respond to all group messages in allowed groups
      group_sessions_per_user: false
      # Mention-only mode with group awareness.  With group_chat_all: false the
      # bot only answers @-mentions; group_listen_context: N keeps the last N
      # non-mentioned messages in memory (no model call, no reply) and prepends
      # them as read-only context when the bot is finally mentioned.
      # 0 = pure mention-only with no group context.
      group_listen_context: 0
      # QQ groups cannot mention-attach a file, so a bare upload is the only
      # signal.  Save group files locally while nobody is talking to the bot so
      # a later mention can actually open them.
      group_file_autosave: true
      group_file_backfill: true      # scan the group file list on connect (catches restart gaps)
      group_file_backfill_limit: 10  # most recent files per group per scan
      group_file_max_mb: 30          # skip larger files
      group_file_retention_days: 30  # delete collected files after N days

      # Media and event batching.
      request_timeout: 60
      chunk_size: 65536
      enable_online_file: true
      batch_delay_seconds: 1.2      # merge image + follow-up text events
      split_batch_delay_seconds: 2.5
      split_threshold: 1800

      # WebSocket recovery and recent-message backfill.
      # Backfill only queries explicit private/group allowlist targets.
      history_backfill_count: 20
      history_backfill_seconds: 600
      ws_reconnect_delay_seconds: 3
      ws_ping_interval_seconds: 25
      ws_ping_timeout_seconds: 15
      health_check_interval_seconds: 15

    # Optional home channel for cron/cross-platform delivery.
    home_channel:
      platform: qq
      chat_id: group:987654321
      name: QQ group 987654321

  # Strongly recommended if you only use personal QQ/NapCat.
  qqbot:
    enabled: false

# QQ cannot edit messages, so keep permanent progress noise low.
display:
  platforms:
    qq:
      tool_progress: off
      streaming: false
      interim_assistant_messages: false
      show_reasoning: false
